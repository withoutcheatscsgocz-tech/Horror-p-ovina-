name: Build Android APK

# Builds a debug APK for HOLLOW on every push / manual run, and
# uploads it as a downloadable workflow artifact.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Add Android platform
        run: cordova platform add android@13 || cordova platform add android

      - name: Build debug APK
        run: cordova build android --verbose

      - name: Locate APK
        id: apk
        run: |
          APK=$(find platforms/android -name "*-debug.apk" | head -n 1)
          echo "Found APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hollow-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
